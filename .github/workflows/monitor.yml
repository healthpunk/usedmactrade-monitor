name: monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:

# Never let two runs race on state.json.
concurrency:
  group: usedmactrade-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new listings
        id: monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
        # exit 1 = notification problem, 2 = fetch/parse problem; state is
        # still committed below so known listings are never re-notified.
        continue-on-error: true

      - name: Persist state
        run: |
          if git diff --quiet -- state.json; then
            echo "state unchanged"; exit 0
          fi
          git config user.name "usedmactrade-monitor[bot]"
          git config user.email "usedmactrade-monitor@users.noreply.github.com"
          git add state.json
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Fail the run if the monitor failed
        if: steps.monitor.outcome == 'failure'
        run: exit 1
